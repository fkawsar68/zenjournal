        /* CSS Theme Variables */
        :root {
            --bg-base: #09090b;
            --bg-surface: #121214;
            --bg-element: #1c1c1f;
            --bg-element-hover: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #27272a;
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
        }

        /* Premium Light Theme */
        .theme-light {
            --bg-base: #f9f9fb;
            --bg-surface: #ffffff;

        /* Premium Theme: Nord */
        .theme-nord {

            --shadow: 0 4px 12px rgba(46, 52, 64, 0.3);

        /* Premium Theme: Solarized Dark */
        .theme-solarized {
            --bg-base: #002b36;

            --bg-element: #0a4453;

            --accent: #2aa198;
            --accent-hover: #268bd2;
            --border: #0a4453;
            --shadow: 0 4px 12px rgba(0, 43, 54, 0.4);
        }

        /* Premium Theme: Cyberpunk */
        .theme-cyberpunk {
            --bg-base: #000b19;
            --bg-surface: #00142d;
            --bg-element: #09335a;
            --bg-element-hover: #0c4377;
            --text-main: #00ffcc;
            --text-muted: #ff007f;
            --accent: #ff007f;
            --accent-hover: #ff3399;
            --border: #00ffcc;
            --shadow: 0 4px 12px rgba(0, 11, 25, 0.6);
        }

        /* Reset & Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Sidebar Styling */
        aside {
            width: 250px;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .brand {
            padding: 24px;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: -0.02em;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-section {
            padding: 16px 12px;
            border-bottom: 1px solid var(--border);
        }

        .nav-btn {
            width: 100%;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 12px;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
            transition: background-color 0.15s, color 0.15s;
        }

        .nav-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: var(--bg-element);
            color: var(--text-main);
        }

        .list-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 16px 12px;
        }

        .list-header {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 12px;
            padding-left: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            border: none;
            color: var(--accent);

            padding: 0 4px;
            display: flex;
            align-items: center;
        }

            fill: none;
